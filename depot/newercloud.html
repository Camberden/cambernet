<div hx-get="newercloud.html" hx-trigger="submit delay:1s" hx-target="this" hx-swap="outerHTML">
	<dl>
		<template x-for="cloud in await $get('/api/media/clouds')">
			<div class="grid-col-1-1-1-1" style="width:30rem; height:fit-content; border: 0.1rem solid cornflowerblue;">
				<div>
					<b x-html="cloud.id"></b>
				</div>
				<div>
					<dt x-html="'Cloud Title: ' + cloud.title"></dt>
				</div>
				<div>
					<dd x-html="'Cloud Thought: ' + cloud.thought"></dd>
				</div>
				<div>
					<button style="border-color:darkred;" :hx-delete="'/api/media/clouds/' + cloud.id"
						hx-trigger="click" hx-target="#alter" hx-swap="innerHTML"
						hx-confirm="'Are you sure you want to delete this cloud?'" x-effect="htmx.process($el)"
						@click="$store.site.reroute();" x-text="'Delete'"></button>
				</div>
			</div>
		</template>
	</dl>
</div>
