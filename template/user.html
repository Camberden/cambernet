<div style="border: 0.2rem ridge transparent; width: 12rem;" x-data>
	<template x-for="(spec, index) in CMBRutil.user" :key=" index">
		<div style="color: burlywood;" x-data>
			<template x-if="index === 'identity'">
				<samp class="rarr" x-html="spec" x-initialized="$store.cmbr.setSiteUser(spec)"></samp>
			</template>
		</div>
	</template>
</div>
