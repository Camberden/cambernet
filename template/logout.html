<div x-data>
	<form id="logout-form" class="cmbr-flexfixed" action='/api/auth/logout' method='POST'
		@submit="CMBRutil.setUser(null); $store.cmbr.setSiteUser(null);">

		<h2 :id="$id('modal-title')" class="marker-green">Confirm Logout?</h2>
		<hr class=" hr-cmbr-dark-gradient">
		<hr class="hr-groove-top">

		<div class="grid-col-1-1">
			<button class="cmbr-button-chrispy" type="button" x-on:click="openModal = false" cmbr-i>
				Cancel
			</button>
			<button class="cmbr-button-chrispy"
				x-on:submit="openModal = false; CMBRutil.setUser(null); $store.cmbr.setSiteUser(null);" type="submit"
				id="logout" cmbr-i>Logout</button>
		</div>
	</form>
</div>
