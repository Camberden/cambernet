<!DOCTYPE html>
<html lang="en-US">
<!-- Hi there! :V -->

<head>
	<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="images/cmbr-sig.svg">
	<link rel="stylesheet" type="text/css" href="/styles.css" media="screen" />
	<link rel="stylesheet" type="text/css" href="/workspace/workspace.css" media="screen" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css">
	<script src="https://unpkg.com/@popperjs/core@2"></script>
	<script src="https://unpkg.com/tippy.js@6"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.6/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://unpkg.com/alpinejs-fetch@latest/dist/api.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4/dist/purify.min.js"></script>
	<script src="cmbr.js"></script>
	<script src="htmx.js"></script>
	<title>Chrispy's Site</title>
</head>

<body x-ref="body" data-theme="dark" x-data="{
	siteUser: {},
	activeSection: 'Home',
	purgeInterval: function() {
		CMBRutil.killInterval(CMBRutil.interval); 
	},
}">
	<nav hx-get="nav.html" hx-trigger="load" hx-target="this" hx-swap="outerHTML"
		x-effect="siteUser = $get('/api/auth/reactivate')"></nav>

	<hr class="hr-push-down">

	<!-- <style>
		.index-grid {
			display: grid;
			gap: 0.5rem;
			grid-template-columns: repeat(1, 100%);
			max-width: 60%;
			margin-inline: auto;
		}
	</style> -->
	<main class="index-grid" x-effect="CMBRutil.mainView = 'Home'">

		<div id="camberden-div">
			<h1 hx-get="/one/camberden.html" hx-trigger="load" hx-target="this" hx-swap="outerHTML">camberden</h1>
			<div id="camberden-bar" class="button-grid-row">
				<div class="options1" x-data="{
				id: 1,
				get expanded() {
					return this.active === this.id
				},
				set expanded(value) {
					this.active = value ? this.id : null
				},
			}" role="region">
					<button id="chart-access" type="button" @click="expanded = !expanded"
						hx-get="/template/mediatool.html" hx-trigger="load" hx-target="#chart-links"
						hx-swap="innerHTML">
						<div class="trigger-dropdown">
							<span x-show="expanded" x-cloak>&UpArrow;</span>
							<span x-show="!expanded" x-cloak>&DownArrow;</span>
							<span class="vt323">Options</span>
							<span x-show="expanded" x-cloak>&UpArrow;</span>
							<span x-show="!expanded" x-cloak>&DownArrow;</span>
						</div>
					</button>
					<div id="chart-dropdown" x-show="expanded" x-collapse>
						<div id="chart-links">
							<template x-show="expanded">

							</template>
						</div>
					</div>
				</div>



				<div value="loginlogout" hx-get="../template/exmodal.html" hx-target="#loginlogout"
					hx-trigger="load delay:1200ms" hx-swap="outerHTML transition:true">
					<div id="loginlogout">
						<img width="100%" height="100%" src="../images/squares-fade.svg" alt="loading..."
							cmbr-loading />
					</div>
				</div>

				<div x-data="{}">
					<template x-if="siteUser !== null">
						<p class="marker" x-text="siteUser" x-effect="CMBRutil.setUser(siteUser)"></p>
					</template>
				</div>
				<div class="options2" hx-get="/template/interval-panel.html" hx-trigger="load" hx-target="this"
					hx-swap="outerHTML" x-text="'Interval'">
				</div>
			</div>
		</div>


		<div id="indexer" class="index-item">
			<!-- <style>
				#info-div {
					display: grid;
					grid-template-columns: 1fr 1fr;
					margin-inline: auto;
					padding-bottom: 3rem;
					flex: 1;
				}

				#info-div-frame {
						box-sizing: content-box;
						border-right: 0.5rem solid transparent;
						margin-inline-end: 0%;
						animation-name: info-div-load;
						animation-duration: 10s;
						animation-delay: 1s;
						animation-iteration-count: infinite;
						animation-direction: normal;
						animation-timing-function: ease-in-out;
				}

				#info-div-background {
					background-image: none;
					background-size: cover;
					width: 100%;
					height: 100%;
					opacity: 0%;
					animation-name: info-div-shift;
					animation-duration: 10s;
					animation-delay: 1s;
					animation-iteration-count: infinite;
					animation-direction: normal;
					animation-timing-function: ease-in-out;
					animation-play-state: running;
				}
			</style> -->
			<div id="slideshow-div" hx-get='/one/indexinfo.html' hx-trigger="load" hx-target="this" hx-swap="outerHTML">
			</div>
		</div>

		<hr class="hr-cmbr-gradient">
		<div id="sections">
			<!-- <div class="section-title" hx-get="/one/one.html" hx-target="#page-info" hx-swap="innerHTML"
				hx-trigger="click" x-show="!activeSection">
				<span x-text="'Just One Stop'"></span>
			</div> -->
			<div class="section-title" hx-get="/one/indexinfo.html" hx-target="#indexer" hx-swap="innerHTML"
				hx-trigger="click" x-show="activeSection !== 'Home'" @click="activeSection = 'Home'">
				<span x-text="'Home'"></span>
			</div>
			<div class="section-title" hx-get="/template/step-pay-plan.html" hx-target="#indexer" hx-swap="innerHTML"
				hx-trigger="click" x-show="activeSection !== 'Finance'"
				@click="activeSection = 'Finance'; purgeInterval();">
				<span x-text="'Step Pay'"></span>
			</div>
			<div class="section-title" hx-get="/one/frame-theatre.html" hx-target="#indexer" hx-swap="innerHTML"
				hx-trigger="click" x-show="activeSection !== 'Documents'"
				@click="activeSection = 'Documents'; purgeInterval();">
				<span x-text="'Frame Theatres'"></span>
			</div>

		</div>
		<hr class="hr-cmbr-gradient">


		<!-- <hr class="hr-groove-bottom"> -->
		<footer class="index-footer" hx-get='/footer.html' hx-trigger="load" hx-target="this" hx-swap="outerHTML">
		</footer>

	</main>
	<script src="action.js"></script>
</body>

</html>
