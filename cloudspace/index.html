<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="/images/cmbr-sig.svg">
	<link rel="stylesheet" type="text/css" href="/styles.css" media="screen" />
	<link rel="stylesheet" type="text/css" href="cmbr-cloud.css" media="screen" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/1.11/simplemde.min.css">
	<script src="https://cdn.jsdelivr.net/simplemde/1.11/simplemde.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.6/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://unpkg.com/alpinejs-fetch@latest/dist/api.min.js"></script>

	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4/dist/purify.min.js"></script>
	<script src="/cmbr.js"></script>
	<script src="/htmx.js"></script>
	<title>Chrispy's Cloudspace</title>
</head>

<body data-theme="light" style="height: 100vh; overflow-x: hidden !important;" x-data="{
	siteUser: {},
	activeSection: 'Workspace',
	setSiteUser: function(iden) {
		this.siteUser = iden;
	},
	getSiteUser: function() {
		return this.siteUser;
	},
	purgeInterval: function() {
		CMBRutil.killInterval(CMBRutil.interval); 
	},
}" x-effect="siteUser = await $get('/api/auth/reactivate')">
	<nav id=" nav" hx-get="../nav.html" hx-target="this" hx-trigger="load" hx-swap="innerHTML" x-bg>
	</nav>

	<main x-data="{
		sky:{},
		cloudSpeedVal: 20,
		cloudDelayVal: 0,
		cloudWidthVal: 10,
		cloudPadVal: 0.0,
		getClouds: function() {
			return $get('/api/media/clouds');
		},
		notice: {},
		parseNotice: function() {
			return JSON.parse(this.notice);
		},
		cloudSelected: 6,
		cloudChange: {
			showing: false,
			toggle() {
				this.showing = ! this.showing;
			},
		},
		grabCloud: function(num){
			this.cloudSelected = num;
			return this.cloudSelected;
		},
		routeCloudReload: function() {
			return $get('cloudReloaded');
		},

		routeCloudProperties: function(targetEl, loadVals) {

			const div = document.createElement('div');
			div.classList.add('cmbr-cloud');
			const theseVals = Array.from(loadVals);
			const cloudSpeed = (Math.random() * 10 + 10).toFixed(0);
			const cloudDelay = 0;
			const cloudWidth = ((Math.random() * 5) + 10).toFixed(0);
			const cloudPad = (theseVals[1].length / 10).toFixed(0);
			div.setAttribute('style', `
				width: ${cloudWidth}rem;
				height: ${cloudWidth}rem;
				animation-duration: ${cloudSpeed - cloudDelay}s;
				animation-delay: ${cloudDelay}s;
				`);
			div.innerText = loadVals[0] + ' | ' + loadVals[1] + ' | ' + loadVals[2];
			targetEl.appendChild(div);
			const cloudTimeout = setTimeout(() => {
				while (targetEl.lastChild) {
					targetEl.removeChild(targetEl.lastChild);
				}
				this.legacyCloudGen(targetEl, loadVals);
				clearTimeout(cloudTimeout);
			}, (cloudSpeed * 1000));
		},



		legacyCloudGen: function(targetEl, loadVals) {
			const cloudSpeed = (Math.random() * 10 + 10).toFixed(0);
			const cloudDelay = (Math.random() * 8).toFixed(0);
			const cloudWidth = ((Math.random() * 5) + 10).toFixed(0);
			const cloudPad = (loadVals[1].length / 10).toFixed(1);
			/**
			 * @type {HTMLElement} div
			 */
			const div = document.createElement('div');
			const dt = document.createElement('dt');
			const dtTxt = document.createTextNode(loadVals[2] + ' | ' + loadVals[0]);
			dt.appendChild(dtTxt);
			const dd = document.createElement('dd');
			const ddTxt = document.createTextNode(loadVals[1]);
			dd.setAttribute('style', `padding-left: ${cloudPad}px; padding-right: ${cloudPad}px;`);
			dd.appendChild(ddTxt);
			div.appendChild(dt);
			div.appendChild(dd);
			div.setAttribute('class', 'cmbr-cloud');
			div.setAttribute('style', `
				value: ${loadVals[2]};
				width: ${cloudWidth}rem;
				height: ${cloudWidth}rem;
				animation-duration: ${cloudSpeed - cloudDelay}s;
				animation-delay: ${cloudDelay}s;
			`);
			targetEl.appendChild(div);
			const cloudTimeout = setTimeout(() => {
				while (targetEl.lastChild) {
					targetEl.removeChild(targetEl.lastChild);
				}
				this.legacyCloudGen(targetEl, loadVals);
				clearTimeout(cloudTimeout);
			}, cloudSpeed * 1000);
		},
		getCloudById: function(clId) {
			const result = this.sky.find(x => x.id === clId).title;
			return result;
		},
		getCloudThoughtById: function(clId) {
			const result = this.sky.find(x => x.id === clId).thought;
			return result;
		},

	}" x-init="sky = await getClouds();">
		<!-- % !ALTER! % -->
		<!-- ^ Shows when notifier off. ^ -->
		<slot id="alter" @htmx:before-swap="notice = event.detail.serverResponse;"
			@htmx:after-settle="$store.notifier.toggle()" hx-get="notice" hx-target="#notifier"
			hx-trigger="htmx:after-settle" hx-swap="innerHTML">
		</slot>
		<slot style="height:5rem;">
			<div x-show="$store.notifier.open === false;">
				<i x-text="'Cloud Selected: ' + cloudSelected"></i>
			</div>
			<div id="notifier"></div>
		</slot>

		<!-- ! NOTIFIER ! %-->

		<!-- ^ Shows when notifier on. ^ -->
		<slot hx-get="newercloud" hx-trigger="htmx:after-swap from:(#notifier)" hx-target="#cloudDataList"
			hx-swap="innerHTML transition:true" x-show="$store.notifier.open === true;">
		</slot>

		<slot hx-get="cloudReloaded" hx-trigger="htmx:after-swap from:(#notifier)" hx-target="#cloud-zone"
			hx-swap="innerHTML transition:delay.500ms" x-show="$store.notifier.open === true;">
		</slot>
		<!-- <img width="100%" height="100%" src="../images/squares-fade.svg" alt="loading..." cmbr-loading /> -->

		<!-- ^ CLOUD GEN ^ -->
		<section id="cloud-zone" class="grid-row-10x-1">
			<div style="display:contents" x-data>
				<template x-for="(cloud, index) in getClouds()" :key="index">
					<div style="height: 5rem; width: 100%;">
						<template x-if="index < 10">
							<div style="position: sticky; display: contents;"
								x-effect="routeCloudProperties($el, [cloud.title, cloud.thought, cloud.id])"
								@click="grabCloud(parseInt(cloud.id))">
							</div>
						</template>
					</div>
				</template>
			</div>
		</section>

		<section
			style="z-index:90; position: sticky; opacity: 100%; left:0%; bottom:25%; top:50%; width:25rem; height: 20rem; text-align: left;">

			<div class=" cmbr-item" style="border: 0.5rem groove black;">
				<!-- ! CREATE ! %-->
				<form id="new-cloud-form" hx-post='/api/media/clouds' hx-trigger="submit" hx-target="#alter"
					hx-swap="none settle:1s transition:true">
					<label for="title" x-text="'Cloud Title'"></label>
					<input class="cmbr-input-1" type="text" :id=$id('title') required>
					<br>
					<div id="mdeditor-handle" style="text-align: left; width:80%;" x-data="{
							value: '_A thought, fleeting like a cloud._',
							init() {
								let editor = CMBRutil.md();
								editor.value(this.value);
								editor.isSideBySideActive() ? console.log() : $store.navStore.toggle();
								editor.codemirror.on('change', ()=> {
									this.value = editor.value();
								});
							},
						}">
						<label for="thought" x-text="'Cloud Thought'"></label>
						<input x-ref="mdinput" type='hidden' name='mdinput' :value="value" :id=$id('thought') />
						<textarea x-ref="editor" type="textarea"></textarea>
					</div>
					<br>
					<label for="weight" x-text="'Cloud Weight'"></label>
					<input class="cmbr-input-1" type="number" name="weight" :id=$id('weight')>
					<button type="submit" x-text="'Make Cloud'" @click="htmx.process($el);" cmbr-i>
					</button>
				</form>
			</div>
			<div>
				<hr class="hr-cmbr-gradient">
			</div>
		</section>



		<section class="cmbr-flexfixed"
			style="position:fixed; z-index:90; background: var(--cmbr-blass); opacity: 50%; bottom:2%; right:0%; width:30rem; height:20rem; border: 0.5rem groove black;">
			<div id="cloudDataList">
				<!-- ! TEMPLATE ! -->
				<dl>
					<template x-for="cloud in getClouds()">
						<div class=" grid-col-5x-1" @mouseenter="cloudSelected = cloud.id"
							:style="cloudSelected === cloud.id ? 'background-color:darkslategrey; color:goldenrod; cursor: pointer;' : 'background-color:inherit;'"
							style="width:30rem; height:fit-content; text-align: left; border: 0.1rem solid cornflowerblue;">
							<div>
								<b x-html="cloud.id"></b>
							</div>
							<div>
								<b x-html="cloud.username"></b>
							</div>
							<div>
								<dt x-html="cloud.title"></dt>
							</div>
							<div>
								<dd x-html="cloud.thought"></dd>
							</div>
							<div>
								<button style="border-color:darkred;" :hx-delete="'/api/media/clouds/' + cloud.id"
									hx-trigger="click" hx-target="#alter" hx-swap="none settle:1s transition:true"
									@click="htmx.process($el)" x-text="'Delete'"></button>
							</div>
						</div>
					</template>
				</dl>
			</div>
		</section>

	</main>
</body>

</html>
