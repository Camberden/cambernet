<div x-data="{ 
	folderData: {},
	 }">

	<button class="trigger-box" @click="folderData = await $get('/api/media/fantasy-graphics')">
		Graphics
	</button>

	<div class="cmbr-pen flex-grid-cmbr flex-table-r" hx-get="/api/media/fantasy-graphics" hx-target="#info-div-frame"
		hx-trigger="load" hx-swap="innerHTML" x-effect="JSON.stringify(folderData, null, 2)">
		<template x-for="(item, index) in folderData" :key="index">
			<div>
				<figure>
					<img :src="'/assets/fantasy-graphics/' + item" width="200" height="200"
						@mouseover="$tooltip(item); $el.style='outline: 0.3rem solid transparent; cursor: pointer;'"
						@mouseout="$el.style='outline:none;'" />
					<figcaption>
						<a :href="'/assets/fantasy-graphics/' + item" target="'_blank'" x-text="'→ Link'"></a>
					</figcaption>
				</figure>
			</div>
		</template>
	</div>
</div>
