<div x-data="{ 
	folderData: {},
	 }" x-effect="folderData = await $get('/api/media/artifacts')">

	<div class="cmbr-pen flex-grid-cmbr flex-table-r" x-effect="JSON.stringify(folderData, null, 2)">
		<template x-for="(item, index) in folderData" :key="index">
			<div>
				<figure>
					<img :src="'/assets/artifacts/' + item" width="200" height="200"
						@mouseover="$tooltip(item); $el.style='outline: 0.1rem solid magenta; cursor: pointer;'"
						@mouseout="$el.style='outline:none;'" />
					<figcaption>
						<a :href="'/assets/artifacts/' + item" target="'_blank'" x-text="'→ Link'"></a>
					</figcaption>
				</figure>
			</div>
		</template>
	</div>
</div>
