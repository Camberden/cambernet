<div x-data="{
	modalVar: 'photos',
	folderData: {},
	imageRequest: {
		uploads: '/images/uploads/',
		travel: '/assets/travel-photos/',
		artifacts: '/assets/artifacts/',
		officers: '/assets/segregation-officers/',
		residents: '/assets/segregation-residents/'
	}
	 }" x-effect="folderData = await $get('/api/media/travel-photos')">

	<div class="cmbr-pen flex-grid-cmbr flex-table-r" x-effect="JSON.stringify(folderData, null, 2)" x-data>
		<template x-for="(item, index) in folderData" :key="index">
			<div>
				<figure>
					<img :src="'/assets/travel-photos/' + item" width="200" height="200"
						@mouseover="$tooltip(item); $el.style='outline: 0.1rem solid magenta; cursor: pointer;'"
						@mouseout="$el.style='outline:none;'" />
					<figcaption class='vt323'>
						<a :href="'/assets/travel-photos/' + item" target="'_blank'" x-text="'→ Link'"></a>
					</figcaption>
				</figure>
			</div>
		</template>
	</div>

</div>
